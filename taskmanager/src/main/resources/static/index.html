<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-strong: #eef2f7;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #3b82f6;
      --primary-strong: #1d4ed8;
      --success: #16a34a;
      --success-strong: #14532d;
      --warning: #f59e0b;
      --warning-strong: #b45309;
      --danger: #ef4444;
      --danger-strong: #b91c1c;
      --shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      --radius: 20px;
      --radius-sm: 12px;
      --spacing: 1rem;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #f8fbff 0%, #eef4fb 100%);
      color: var(--text);
    }

    body {
      padding: 1.5rem;
      line-height: 1.5;
    }

    button, input, select, textarea {
      font: inherit;
    }

    .page-shell {
      max-width: 1180px;
      margin: 0 auto;
    }

    header.page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1.4rem 1.5rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid rgba(209, 213, 219, 0.7);
      box-shadow: var(--shadow);
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(1.9rem, 2.4vw, 2.6rem);
      letter-spacing: -0.03em;
    }

    .page-header button {
      border: none;
      border-radius: 999px;
      padding: 0.95rem 1.4rem;
      color: #ffffff;
      background: var(--primary);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .page-header button:hover {
      background: var(--primary-strong);
      transform: translateY(-1px);
    }

    .filter-panel {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1.2rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid rgba(209, 213, 219, 0.7);
      box-shadow: var(--shadow);
    }

    .filter-panel label {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .filter-panel select,
    .filter-panel input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      background: var(--surface-strong);
      color: var(--text);
    }

    .filter-panel button {
      height: min-content;
      align-self: flex-end;
      padding: 0.9rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .filter-panel button:hover {
      background: #f3f4f6;
    }

    #task-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .task-card {
      position: relative;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid rgba(209, 213, 219, 0.85);
      padding: 1.3rem;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .task-card.warning {
      border-color: rgba(245, 158, 11, 0.35);
    }

    .task-card .task-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    .task-card .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #ffffff;
    }

    .badge-status-todo { background: #6b7280; }
    .badge-status-in_progress { background: #2563eb; }
    .badge-status-complete { background: #16a34a; }
    .badge-priority-low { background: #22c55e; }
    .badge-priority-medium { background: #f59e0b; }
    .badge-priority-high { background: #ef4444; }

    .task-card .task-body {
      color: var(--muted);
      white-space: pre-wrap;
      min-height: 2.2rem;
    }

    .task-card .task-footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .task-card .task-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .task-card .task-actions button {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.65rem 1rem;
      background: transparent;
      cursor: pointer;
      font-weight: 600;
      color: var(--primary-strong);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .task-card .task-actions button:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .task-card .warning-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.12);
      color: var(--warning-strong);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .dialog-backdrop,
    .confirm-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 20;
    }

    dialog {
      width: min(100%, 560px);
      border: none;
      border-radius: var(--radius);
      padding: 0;
      box-shadow: var(--shadow);
      background: transparent;
    }

    .dialog-panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: grid;
      gap: 1rem;
    }

    .dialog-panel h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    .dialog-grid {
      display: grid;
      gap: 1rem;
    }

    .dialog-grid label {
      display: grid;
      gap: 0.45rem;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .dialog-grid input,
    .dialog-grid textarea,
    .dialog-grid select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      background: var(--surface-strong);
      color: var(--text);
    }

    .dialog-grid textarea {
      min-height: 120px;
      resize: vertical;
    }

    .dialog-panel .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .dialog-panel .dialog-actions button {
      min-width: 110px;
      border-radius: 999px;
      border: none;
      padding: 0.9rem 1.25rem;
      cursor: pointer;
      font-weight: 700;
    }

    .dialog-panel .dialog-actions .cancel-btn {
      background: #f3f4f6;
      color: var(--text);
    }

    .dialog-panel .dialog-actions .submit-btn {
      background: var(--primary);
      color: #ffffff;
    }

    .confirm-content {
      padding: 1.5rem;
      background: var(--surface);
      border-radius: var(--radius);
      display: grid;
      gap: 1rem;
      width: min(100%, 460px);
    }

    .confirm-content p {
      margin: 0;
      color: var(--text);
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .confirm-actions button {
      min-width: 110px;
      border-radius: 999px;
      border: none;
      padding: 0.85rem 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .confirm-actions .confirm-btn {
      background: var(--danger);
      color: #ffffff;
    }

    .confirm-actions .cancel-btn {
      background: #e5e7eb;
      color: var(--text);
    }

    @media (max-width: 900px) {
      #task-list {
        grid-template-columns: 1fr;
      }

      .filter-panel {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 1rem;
      }

      .page-header,
      .filter-panel {
        padding: 1rem;
      }

      .dialog-panel {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p style="margin:0; color:var(--muted); text-transform: uppercase; letter-spacing:0.18em; font-size:0.85rem;">Task Manager</p>
        <h1>Task Manager</h1>
      </div>
      <button type="button" id="new-task-button">New Task</button>
    </header>

    <section class="filter-panel" aria-label="Task filters">
      <label for="search-input">
        Search
        <input id="search-input" name="search-input" type="search" placeholder="Search by keyword..." />
      </label>
      <label for="status-filter">
        Status
        <select id="status-filter" name="status-filter">
          <option value="ALL">All</option>
          <option value="TODO">TODO</option>
          <option value="IN_PROGRESS">IN_PROGRESS</option>
          <option value="COMPLETE">COMPLETE</option>
        </select>
      </label>
      <label for="priority-filter">
        Priority
        <select id="priority-filter" name="priority-filter">
          <option value="ALL">All</option>
          <option value="LOW">LOW</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="HIGH">HIGH</option>
        </select>
      </label>
      <button type="button" id="clear-filters-button">Clear</button>
    </section>

    <section id="task-list" aria-label="Task list">
      <!-- Task cards are rendered by app.js -->
    </section>
  </div>

  <div class="dialog-backdrop" id="task-dialog-backdrop">
    <dialog id="task-dialog" aria-modal="true" role="dialog">
      <div class="dialog-panel">
        <div>
          <h2 id="dialog-title">Create Task</h2>
          <p style="margin:0; color:var(--muted);">Add or edit task details and save to your task list.</p>
        </div>
        <form id="task-form" class="dialog-grid" method="dialog">
          <label for="task-title">
            Title
            <input id="task-title" name="title" type="text" required maxlength="255" placeholder="Enter task title" />
          </label>
          <label for="task-description">
            Description
            <textarea id="task-description" name="description" maxlength="2000" placeholder="Optional description"></textarea>
          </label>
          <label for="task-priority">
            Priority
            <select id="task-priority" name="priority" required>
              <option value="LOW">LOW</option>
              <option value="MEDIUM" selected>MEDIUM</option>
              <option value="HIGH">HIGH</option>
            </select>
          </label>
          <label for="task-duedate">
            Due date
            <input id="task-duedate" name="dueDate" type="date" />
          </label>
          <div class="dialog-actions">
            <button type="button" class="cancel-btn" id="task-cancel-button">Cancel</button>
            <button type="submit" class="submit-btn">Save Task</button>
          </div>
        </form>
      </div>
    </dialog>
  </div>

  <div class="confirm-backdrop" id="confirm-dialog">
    <div class="confirm-content" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div>
        <h2 id="confirm-title">Delete Task</h2>
        <p>Are you sure you want to delete this task? This action cannot be undone.</p>
      </div>
      <div class="confirm-actions">
        <button type="button" class="cancel-btn" id="confirm-cancel-button">Cancel</button>
        <button type="button" class="confirm-btn" id="confirm-delete-button">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
